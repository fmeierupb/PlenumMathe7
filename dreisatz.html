<style>
:root{--bg:#fbfaf6;--fg:#161a22;--mut:#9aa0ad;--line:#d9d7cf;--c1:#2563eb;--c2:#f08a00;--c3:#12a150;--cr:#d81e1e;--btn:#fff;--head:#eef3ee}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#f0f2f6;--mut:#7d8596;--line:#343b48;--c1:#5b9bff;--c2:#ffad33;--c3:#3ddc84;--cr:#ff5c5c;--btn:#1f242d;--head:#1c2a22}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:12px 16px calc(12px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:clamp(26px,4.2vw,52px);line-height:1.15;min-height:1.2em}
#fig{flex:1;min-height:0;width:100%;touch-action:none}
#txt{font-size:clamp(20px,3vw,38px);min-height:1.4em;text-align:center}
#eq{font-size:clamp(24px,4.1vw,50px);font-weight:700;min-height:1.4em;text-align:center;font-variant-numeric:tabular-nums;line-height:1.35}
#eq .dim{opacity:.7;font-size:.85em}
#txt .dim{opacity:.7}
#eq .m{font-weight:600;font-size:.72em;text-align:left;max-width:30em;margin:0 auto}
#eq .m2{font-size:.8em}
#eq .merk{display:inline-block;text-align:left;font-weight:600;font-size:.66em;line-height:1.45;max-width:40em;border:3px solid var(--c3);border-radius:14px;padding:.7em 1.2em;background:rgba(18,161,80,.08)}
#eq .merk>div{display:grid;grid-template-columns:1.6em 1fr}
#eq .merk>div+div{margin-top:.6em}
/* Drei Merksätze nebeneinander, damit der Kasten flach bleibt und die Tabelle groß */
#eq .merk.m3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:1.4em;max-width:none;width:100%;box-sizing:border-box;font-size:.5em}
#eq .merk.m3>div+div{margin-top:0}
.k.c1{color:var(--c1)}.k.c2{color:var(--c2)}.k.c3{color:var(--c3)}.k.cr{color:var(--cr)}
footer{display:flex;gap:10px;align-items:center;margin-top:10px}
#extras{display:flex;gap:10px;margin:0 auto}
button{font:inherit;font-size:clamp(16px,2vw,24px);color:inherit;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:12px 18px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.3}
#menu{font:inherit;font-size:clamp(16px,2vw,24px);color:inherit;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-decoration:none}
#fs svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
#fs .fo,html.fs #fs .fi{display:none}
html.fs #fs .fo{display:inline}
#cnt{color:var(--mut);font-size:clamp(14px,1.6vw,20px);min-width:3.5em;text-align:center}
#next{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:700}
footer{flex-wrap:wrap;row-gap:8px}
#extras{flex-wrap:wrap;justify-content:center}
#extras:empty{display:none}
/* Handy hochkant: Zusatzknöpfe in eine eigene Zeile, Zurück nur als Pfeil. Was trotzdem nicht passt, bricht um, statt aus dem Bild zu rutschen. */
@media (max-width:700px){#extras{order:9;flex-basis:100%;margin:0}#next{margin-left:auto}footer{gap:8px}button,#menu{padding:10px 12px}#cnt{min-width:0}}
@media (max-width:420px){#prev .lbl{display:none}}
svg .ln{stroke:var(--fg);stroke-width:4;fill:none}
svg .thin{stroke:var(--fg);stroke-width:2.5;fill:none}
svg .head{fill:var(--head)}
svg .tx{fill:var(--fg);font:700 30px system-ui,sans-serif}

svg .thg{fill:var(--c1);font:600 26px system-ui,sans-serif}
svg .tb{fill:var(--cr);font:700 38px system-ui,sans-serif}
svg .tg{fill:var(--c1);font:700 38px system-ui,sans-serif}
svg .tq{fill:var(--mut);font:600 54px system-ui,sans-serif}
svg .tr{fill:var(--c1);font:700 54px system-ui,sans-serif}
svg .bo{stroke:var(--c2);stroke-width:5;fill:none;stroke-linecap:round}
svg .ah{fill:var(--c2)}
svg .to{fill:var(--c2);font:700 42px system-ui,sans-serif}
svg .to2{fill:var(--c2);font:700 40px system-ui,sans-serif}
svg .tq2{fill:var(--mut);font:700 38px system-ui,sans-serif}
svg .tq3{fill:var(--mut);font:600 34px system-ui,sans-serif}
svg .tm{fill:var(--fg);font:600 22px system-ui,sans-serif;white-space:pre}
svg .tmh{fill:var(--fg);font:700 22px system-ui,sans-serif}
svg .labbg{fill:var(--bg)}
svg .pf{stroke:var(--fg);stroke-width:3}
svg .pfh{fill:var(--fg)}
svg .fr,svg .fb,svg .fq,svg .op{font-family:system-ui,sans-serif;font-weight:600}
svg .fq{fill:var(--mut)}
svg .op{fill:var(--c2);font-weight:700}
svg .ta{fill:var(--fg);font:600 28px system-ui,sans-serif}
svg .tw{fill:var(--fg);font:600 26px system-ui,sans-serif}
svg .fo{fill:var(--c2);font-weight:700}
svg .tbs{fill:var(--cr);font:700 26px system-ui,sans-serif}
svg .tgs{fill:var(--c1);font:700 26px system-ui,sans-serif}
svg .tnb2{fill:var(--cr);font:600 44px system-ui,sans-serif}
svg .tng2{fill:var(--c1);font:600 44px system-ui,sans-serif}
svg .tr2{fill:var(--c1);font:700 44px system-ui,sans-serif}
svg .tq4{fill:var(--mut);font:600 44px system-ui,sans-serif}
svg .thb2{fill:var(--cr);font:600 22px system-ui,sans-serif}
svg .thg2{fill:var(--c1);font:600 22px system-ui,sans-serif}
svg .to3{fill:var(--c2);font:700 36px system-ui,sans-serif}
svg .note{fill:#fff7d6;stroke:var(--fg);stroke-width:3}
svg .noteLine{stroke:#d7b86b;stroke-width:2}
svg .ring{fill:var(--c1)}
svg .tz{fill:var(--fg);font:600 40px system-ui,sans-serif;white-space:pre}
svg .tzd{opacity:.7}
svg .zr{fill:var(--cr)}
svg .zb{fill:var(--c1)}
svg .zo{fill:var(--c2)}
svg .merkbox{fill:rgba(18,161,80,.08);stroke:var(--c3);stroke-width:3}

svg .fb{fill:var(--c1)}
svg .c1{fill:var(--c1);opacity:.62}
svg .c2{fill:var(--c2);opacity:.62}
svg .c3{fill:var(--c3);opacity:.62}
svg .cr{fill:#d81e1e;opacity:.62}

<script>
'use strict';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const text = (x, y, s, c = 'tx', a = 'middle') => `<text class="${c}" x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="central">${s}</text>`;
// Rechenzeichen in der Farbe der Bögen
const op = k => `<span class="k c2">· ${k}</span>`;
const lines = (arr, n = arr.length) => arr.slice(0, n).map((l, i) => `<div class="${i < n - 1 ? 'dim' : ''}">${l}</div>`).join('');

// ---------- Gemeinsames ----------
// Farben wie im Zweisatz: Ausgangsgröße rot, zugeordnete Größe blau, Rechenzeichen orange. Überall gleich, auch in Text und Rechnung.
const KB = x => `<span class="k cr">${x}</span>`;
const KG = x => `<span class="k c1">${x}</span>`;
const opd = k => `<span class="k c2">: ${k}</span>`;
// Text mit eigener Schriftgröße
const tt = (x, y, str, cls, fs, anchor = 'middle') => `<text class="${cls}" style="font-size:${fs}px" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="central">${str}</text>`;
// Bogen als halbe Ellipse von Zeile zu Zeile, Pfeilspitze zur Tabelle hin. Das Rechenzeichen steht außen neben dem Scheitel.
const ebogen = (x0, a, ya, yb, lab, fs, side) => {
  // Halbe Ellipse von Zeile zu Zeile. Die Spitze folgt der Bogenlinie: Sie zeigt in Richtung der Sehne über ihre Länge, wie eine gebogene Spitze.
  const b = (yb - ya) / 2, sw = side < 0 ? 0 : 1, y = (ya + yb) / 2;
  const P = t => [x0 + side * a * Math.sin(t), y - b * Math.cos(t)], E = P(Math.PI);
  let t = Math.PI; while (t > 0 && Math.hypot(P(t)[0] - E[0], P(t)[1] - E[1]) < 22) t -= 0.005;
  const B = P(t), l = Math.hypot(E[0] - B[0], E[1] - B[1]), ux = (E[0] - B[0]) / l, uy = (E[1] - B[1]) / l;
  const T = [B[0] + ux * 30, B[1] + uy * 30], f = p => p.map(v => v.toFixed(1)).join(',');
  return `<path class="bo" d="M${x0},${ya} A${a} ${b} 0 0 ${sw} ${f(B)}"/>` +
    `<polygon class="ah" points="${f(T)} ${f([B[0] - uy * 12, B[1] + ux * 12])} ${f([B[0] + uy * 12, B[1] - ux * 12])}"/>` +
    tt(x0 + side * (a + 8), y, lab, 'op', fs, side < 0 ? 'end' : 'start');
};
const KOPF = [['Anzahl der', 'Schnellhefter'], ['Preis', 'in €']];
// Tabelle wie im Zweisatz mit beliebig vielen Zeilen. rows: [links, rechts]. Leere Werte bleiben leer, '?' erscheint grau.
// g: L linker Rand, cw Spaltenbreite, T oben, hh Kopfhöhe, rh Zeilenhöhe, fk/fw/fb Schrift Kopf/Werte/Bögen, a Ausbuchtung der Bögen
function tab(g, rows, kopf) {
  const n = rows.length, M = g.L + g.cw, R = g.L + 2 * g.cw, H = g.T + g.hh, B = H + n * g.rh;
  const ry = i => H + (i + 0.5) * g.rh, cx = [g.L + g.cw / 2, M + g.cw / 2];
  let s = `<rect class="head" x="${g.L}" y="${g.T}" width="${2 * g.cw}" height="${g.hh}"/>`;
  s += `<rect class="ln" x="${g.L}" y="${g.T}" width="${2 * g.cw}" height="${B - g.T}"/>`;
  s += `<line class="ln" x1="${M}" y1="${g.T}" x2="${M}" y2="${B}"/><line class="ln" x1="${g.L}" y1="${H}" x2="${R}" y2="${H}"/>`;
  for (let i = 1; i < n; i++) s += `<line class="thin" x1="${g.L}" y1="${H + i * g.rh}" x2="${R}" y2="${H + i * g.rh}"/>`;
  if (kopf) (kopf === true ? KOPF : kopf).forEach((ls, j) => ls.forEach((l, i) => { s += tt(cx[j], g.T + g.hh / 2 + (i - 0.5) * g.fk * 1.2, l, j ? 'fb' : 'fr', g.fk); }));
  const cell = (x, y, v, k) => v === '?' ? tt(x, y, '?', 'fq', g.fw) : v ? tt(x, y, v, k, g.fw) : '';
  rows.forEach(([l, r], i) => { s += cell(cx[0], ry(i), l, 'fr') + cell(cx[1], ry(i), r, 'fb'); });
  return s;
}
// Bogen von Zeile i zur nächsten, links (side -1) oder rechts (side 1) der Tabelle
const tbogen = (g, i, side, lab) => {
  const H = g.T + g.hh, ry = j => H + (j + 0.5) * g.rh;
  return ebogen(side < 0 ? g.L - 15 : g.L + 2 * g.cw + 15, g.a, ry(i) + 4, ry(i + 1), lab, g.fb, side);
};

// Bogen von Zeile i nach Zeile j mit eigener Ausbuchtung a
const tbogen2 = (g, i, j, side, lab, a) => {
  const H = g.T + g.hh, ry = k => H + (k + 0.5) * g.rh;
  return ebogen(side < 0 ? g.L - 15 : g.L + 2 * g.cw + 15, a, ry(i) - 4, ry(j), lab, g.fb, side);
};

// Erst die Rechnung, dann auf derselben Folie die Zuordnung und die Frage nach der Proportionalität. Wie beim Eis.

const W6 = 640, H6 = 420, W3i = 640, H3i = 495;
const W4i = 640, H4i = 412;
// Foto mittig um cx, Unterkante bei yb, Höhe h
const foto = (src, w0, h0, cx, yb, h) => { const w = Math.round(w0 * h / h0); return `<image href="${src}" x="${cx - w / 2}" y="${yb - h}" width="${w}" height="${h}"/>`; };
// Pfeil nach rechts mit Rechenzeichen darüber
const pfeilW = y => `<line class="bo" x1="442" y1="${y}" x2="638" y2="${y}"/><polygon class="ah" points="658,${y} 636,${y - 12} 636,${y + 12}"/>` + text(550, y - 26, ': 2', 'to2');
// Folie 1 zeigt nur die Rechnung, Folie 2 dasselbe Bild mit Preis, Zuordnung und Proportionalität.
const pv = () => step > 0 || vis('preis');
function startFig() {
  let s = step === 0 ? '' : vis('zuo') ? '<g data-cx="550">' + text(540, 30, 'Anzahl der Schnellhefter', 'tb', 'end') + `<line class="pf" x1="552" y1="30" x2="582" y2="30"/><polygon class="pfh" points="594,30 580,22 580,38"/>` + text(606, 30, 'Preis', 'tg', 'start') + '</g>'
    : text(550, 30, 'Welche Größen sind einander zugeordnet?', 'tq3');
  s += foto(IMG6, W6, H6, 270, 335, 230) + foto(IMG3, W3i, H3i, 830, 335, 230);
  s += text(270, 365, 'Tom', 'ts') + text(830, 365, 'Mia', 'ts');
  s += text(270, 408, '6 Schnellhefter', 'tb') + text(830, 408, '3 Schnellhefter', 'tb');
  s += text(270, 478, '18 €', 'tg') + (pv() ? text(830, 478, '9 €', 'tg') : text(830, 478, '?', 'tq2'));
  if (vis('k')) s += pfeilW(408);
  if (vis('p')) s += pfeilW(478);
  return s;
}
function startHit(p) {
  if (step === 0) return p.x >= 730 && p.x < 930 && p.y > 450 && p.y < 510 ? 'preis' : null;
  if (p.y < 60) return 'zuo';
  if (p.x > 420 && p.x < 680 && p.y > 360 && p.y < 443) return 'k';
  if (p.x > 420 && p.x < 680 && p.y >= 443 && p.y < 515) return 'p';
  return null;
}
function startEq() {
  if (!pv()) return '';
  const k = vis('k'), q = vis('p');
  const satz = k && q ? `Halb so viele ${KB('Schnellhefter')}, halb so viel ${KG('Geld')}.` : k ? `Halb so viele ${KB('Schnellhefter')} …` : q ? `… halb so viel ${KG('Geld')}.` : '&nbsp;';
  if (step === 0) return `<div class="m2">${KG('18 €')} ${opd(2)} = ${KG('9 €')}</div>`;
  return `<div class="m2">${satz}</div>` +
    (vis('prop') ? '<div class="m2 tap">Ja, die Zuordnung ist proportional.</div>' : '<div class="m2 dim tap">Ist die Zuordnung proportional?</div>');
}

const WZ = 1480, HZ = 470;
const GZ = { L: 203, cw: 170, T: 20, hh: 95, rh: 105, fk: 30, fw: 52, fb: 36, a: 40 };
function zweisatzFig() {
  let s = tab(GZ, [['1', '1,20'], ['2', '2,40'], ['3', '3,60'], ['6', '7,20']], [['Anzahl der', 'Kugeln'], ['Preis', 'in €']]);
  for (const side of [-1, 1]) s += tbogen2(GZ, 0, 2, side, '· 3', 135) + tbogen(GZ, 0, side, '· 2') + tbogen(GZ, 2, side, '· 2');
  const y0 = 60;
  s += `<rect class="merkbox" x="780" y="${y0}" width="800" height="400" rx="14"/>` + tt(808, y0 + 48, 'Zweisatz', 'tmh', 46, 'start');
  const zl = (y, t, nr) => (nr ? tt(808, y0 + 60 + y, nr, 'tm', 33, 'start') : '') + tt(850, y0 + 60 + y, t, 'tm', 33, 'start');
  s += zl(50, 'Zeichne eine Tabelle und beschrifte sie.', '1.') + zl(96, 'Trage die Werte ein, die du kennst.');
  s += zl(162, 'Mit welcher Rechnung kommst du vom', '2.') + zl(208, 'oberen zum unteren Wert?') + zl(254, 'Rechne auf der anderen Seite genauso.');

}

const G3t = { L: 600, cw: 210, T: 40, hh: 92, rh: 115, fk: 30, fw: 48, fb: 34, a: 40 };
function teilenFig() {
  let s = '<g data-fx="0.22">' + foto(IMG6, W6, H6, 150, 290, 220) + foto(IMG3, W3i, H3i, 470, 290, 220) +
    text(150, 322, 'Tom', 'ts') + text(470, 322, 'Mia', 'ts') + '</g>';
  // jede Zahl für sich: rechts steht ein Fragezeichen, solange links schon da ist und rechts noch nicht
  const r2 = [vis('z2l') ? '3' : '', vis('z2r') ? '9' : vis('z2l') ? '?' : ''];
  s += `<g data-fx="0.72" data-m="${G3t.L + G3t.cw}" data-k="tab">` + tab(G3t, [[vis('z1l') ? '6' : '', vis('z1r') ? '18' : ''], r2], vis('kopf'));
  if (vis('b2l')) s += tbogen(G3t, 0, -1, ': 2');
  if (vis('b2r')) s += tbogen(G3t, 0, 1, ': 2');
  return s + '</g>';
}
function teilenHit(p) {
  p = { x: p.x - (FX.tab || 0), y: p.y };
  const L = G3t.L, M = L + G3t.cw, R = M + G3t.cw, H = G3t.T + G3t.hh;
  if (p.x >= L && p.x <= R) {
    if (p.y < H) return 'kopf';
    if (p.y < H + G3t.rh) return p.x < M ? 'z1l' : 'z1r';
    return p.x < M ? 'z2l' : 'z2r';
  }
  if (p.y > H && p.x < L && p.x > L - 200) return 'b2l';
  if (p.y > H && p.x > R && p.x < R + 200) return 'b2r';
  return null;
}
// Merksätze wie beim Eis, nur jetzt mit Teilen
function teilenEq() {
  const z = [];
  const werte = ['z1l', 'z1r', 'z2l', 'z2r'].some(vis);
  if (vis('kopf') || werte) z.push(`<div><b>1.</b><span>Zeichne eine Tabelle und beschrifte sie.${werte ? '<br>Trage die Werte ein, die du kennst.' : ''}</span></div>`);
  if (['b2l', 'b2r'].some(vis)) z.push(`<div><b>2.</b><span>Mit welcher Rechnung kommst du vom oberen zum unteren Wert?${vis('b2r') ? '<br>Rechne auf der anderen Seite genauso.' : ''}</span></div>`);
  return z.length ? `<div class="merk">${z.join('')}</div>` : '';
}

// ---------- Folie 4 und 5: über 1 ----------
const W2 = 1100, H2 = 445;
const G3 = { L: 340, cw: 210, T: 20, hh: 92, rh: 105, fk: 30, fw: 48, fb: 34, a: 36 };
// Folie 5 wie Folie 3 der Zweisatz-Stunde: links die Bilder, rechts die Tabelle Schritt für Schritt, darunter die Merksätze.
const G6 = { L: 600, cw: 210, T: 20, hh: 92, rh: 100, fk: 30, fw: 48, fb: 34, a: 36 };
function dreiFig() {
  let s = '<g data-fx="0.22">' + foto(IMG6, W6, H6, 150, 290, 220) + foto(IMG4, W4i, H4i, 470, 290, 220) +
    text(150, 322, 'Tom', 'ts') + text(470, 322, 'Ben', 'ts') + '</g>';
  const q = (l, r, lv, rv) => [vis(l) ? lv : '', vis(r) ? rv : vis(l) ? '?' : ''];
  const rows = [[vis('z1l') ? '6' : '', vis('z1r') ? '18' : ''], q('z2l', 'z2r', '1', '3'), q('z3l', 'z3r', '4', '12')];
  s += `<g data-fx="0.72" data-m="${G6.L + G6.cw}" data-k="tab">` + tab(G6, rows, vis('kopf'));
  if (vis('b1l')) s += tbogen(G6, 0, -1, ': 6');
  if (vis('b1r')) s += tbogen(G6, 0, 1, ': 6');
  if (vis('b2l')) s += tbogen(G6, 1, -1, '· 4');
  if (vis('b2r')) s += tbogen(G6, 1, 1, '· 4');
  return s + '</g>';
}
function dreiHit(p) {
  p = { x: p.x - (FX.tab || 0), y: p.y };
  const L = G6.L, M = L + G6.cw, R = M + G6.cw, H = G6.T + G6.hh, row = Math.floor((p.y - H) / G6.rh);
  if (p.x >= L && p.x <= R) {
    if (p.y < H) return 'kopf';
    if (row === 0) return p.x < M ? 'z1l' : 'z1r';
    if (row === 1) return p.x < M ? 'z2l' : 'z2r';
    if (row === 2) return p.x < M ? 'z3l' : 'z3r';
    return null;
  }
  const oben = p.y < H + 1.5 * G6.rh;
  if (p.y > H && p.x < L && p.x > L - 200) return oben ? 'b1l' : 'b2l';
  if (p.y > H && p.x > R && p.x < R + 200) return oben ? 'b1r' : 'b2r';
  return null;
}
// Merksätze nah am Schulbuch, sie wachsen mit den Schritten in der Tabelle
function dreiEq() {
  const z = [], werte = ['z1l', 'z1r', 'z3l'].some(vis);
  if (vis('kopf') || werte || vis('z2l')) z.push(`<div><b>1.</b><span>Zeichne eine Tabelle und beschrifte sie.${werte ? '<br>Trage die Werte ein, die du kennst.' : ''}${vis('z2l') ? '<br>Trage in der mittleren Zeile eine 1 ein.' : ''}</span></div>`);
  if (['b1l', 'b1r'].some(vis)) z.push(`<div><b>2.</b><span>Mit welcher Rechnung kommst du vom oberen Wert zur 1: mal oder geteilt?${vis('b1r') ? '<br>Rechne auf der anderen Seite genauso.' : ''}</span></div>`);
  if (['b2l', 'b2r'].some(vis)) z.push(`<div><b>3.</b><span>Mit welcher Rechnung kommst du von der 1 zum unteren Wert: mal oder geteilt?${vis('b2r') ? '<br>Rechne auf der anderen Seite genauso.' : ''}</span></div>`);
  // feste Spalten: auch noch nicht aufgedeckte Punkte behalten ihren Platz
  while (z.length < 3) z.push('<div></div>');
  return z.some(x => x !== '<div></div>') ? `<div class="merk m3">${z.join('')}</div>` : '';
}

// ---------- Folie 5: fertige Tabelle mit Merksätzen ----------
const W5 = 1480, H5 = 470;
const G5 = { L: 183, cw: 210, T: 40, hh: 100, rh: 140, fk: 30, fw: 54, fb: 38, a: 44 };
function merkFig() {
  let s = tab(G5, [['6', '18'], ['1', '3'], ['4', '12']], true);
  s += tbogen(G5, 0, -1, ': 6') + tbogen(G5, 0, 1, ': 6') + tbogen(G5, 1, -1, '· 4') + tbogen(G5, 1, 1, '· 4');
  // Die Überschrift Dreisatz steht oben im Merkkasten, die Folie selbst hat keine.
  // Merksätze nah am Schulbuch (Dreifach Mathe, Wissen: Werte mit dem Dreisatz berechnen)
  const y0 = 8;
  s += `<rect class="merkbox" x="790" y="${y0}" width="820" height="556" rx="14"/>` + tt(818, y0 + 46, 'Dreisatz', 'tmh', 44, 'start');
  const zl = (y, t, nr) => (nr ? tt(818, y0 + 58 + y, nr, 'tm', 31, 'start') : '') + tt(858, y0 + 58 + y, t, 'tm', 31, 'start');
  s += zl(44, 'Zeichne eine Tabelle und beschrifte sie.', '1.') + zl(88, 'Trage die Werte ein, die du kennst.') + zl(132, 'Trage in der mittleren Zeile eine 1 ein.');
  s += zl(196, 'Mit welcher Rechnung kommst du vom', '2.') + zl(240, 'oberen Wert zur 1: mal oder geteilt?') + zl(284, 'Rechne auf der anderen Seite genauso.');
  s += zl(348, 'Mit welcher Rechnung kommst du von', '3.') + zl(392, 'der 1 zum unteren Wert: mal oder geteilt?') + zl(436, 'Rechne auf der anderen Seite genauso.');
  return s;
}

// seq: Weiter deckt die Teile einzeln in dieser Reihenfolge auf, Zurück nimmt den letzten wieder weg.
// chain: Ein Teil zieht die vorigen mit, Zudecken nimmt die späteren mit.
const STEPS = [
  { t: 'Mia kauft Schnellhefter', vb: [920, 506, 90, 2], seq: 1, parts: ['preis'], hit: startHit, fig: startFig,
    txt: () => `Tom kauft ${KB('6 Schnellhefter')} für ${KG('18 €')}. Mia möchte nur ${KB('3 Schnellhefter')}. Wie viel bezahlt sie?`, eq: startEq },
  { t: 'Überlege zuerst', vb: [920, 506, 90, 2], seq: 1, parts: ['zuo', 'k', 'p', 'prop'], hit: startHit, eqHit: 'prop', fig: startFig, eq: startEq },
  { t: 'Letzte Stunde: Zweisatz', noT: 1, vb: [1595, 528, -5, 12], fig: zweisatzFig },
  { t: 'Zweisatz mit Teilen', vb: [1320, 345, 0, 28], seq: 1, parts: ['kopf', 'z1l', 'z1r', 'z2l', 'b2l', 'b2r', 'z2r'], hit: teilenHit, fig: teilenFig, eq: teilenEq },
  { t: 'Werte mit dem Dreisatz berechnen', vb: [1320, 410, 0, 12], seq: 1, parts: ['kopf', 'z1l', 'z1r', 'z3l', 'z2l', 'b1l', 'b1r', 'z2r', 'b2l', 'b2r', 'z3r'], hit: dreiHit, fig: dreiFig, eq: dreiEq },
  { t: 'Dreisatz', noT: 1, vb: [1555, 568, 62, 2], fig: merkFig }
];

// ---------- Ablauf ----------
// sub zählt bei Folien mit rv: n die schon aufgedeckten Schritte (1 bis n).
let step = 0, shown = false, sub = 0, shownStep = -1;
// Einzeln antippbare Teile: st.parts nennt die Teile, st.hit(p) liefert den getroffenen Teil. Weiter deckt alles auf.
let opened = new Set();
const vis = k => shown || opened.has(k);
const done = (st = STEPS[step]) => (shown && sub >= (st.rv || 1)) || !!(st.parts && st.parts.every(k => opened.has(k)));
function flip(k) {
  const st = STEPS[step];
  if (shown) { shown = false; opened = new Set(st.parts); }
  const i = st.parts.indexOf(k);
  if (opened.has(k)) { opened.delete(k); if (st.chain) st.parts.slice(i + 1).forEach(x => opened.delete(x)); }
  else { opened.add(k); if (st.chain) st.parts.slice(0, i).forEach(x => opened.add(x)); }
}
const txv = x => (typeof x === 'function' ? x() : x) || '';
function put(st, o = {}) {
  $('title').textContent = o.t ?? txv(st.t);
  $('txt').innerHTML = o.txt ?? txv(st.txt);
  $('eq').innerHTML = o.eq ?? (st.eq ? st.eq() : '');
}
// Überschrift, Text und Rechnung bekommen gleich beim Betreten der Folie den Platz ihres vollsten Zustands.
// So bleibt die Zeichnung gleich groß, wenn unten Schritte dazukommen.
const BOX = ['title', 'txt', 'eq'];
function reserve(st) {
  const keep = [shown, sub], hi = BOX.map(() => 0);
  BOX.forEach(id => { $(id).style.minHeight = ''; });
  const m = o => { put(st, o); BOX.forEach((id, i) => { hi[i] = Math.max(hi[i], $(id).offsetHeight); }); };
  for (let i = 0; i <= (st.rv || 0); i++) { shown = i > 0; sub = i; m(); }
  [shown, sub] = keep;
  if (st.seq) { const o = opened; opened = new Set(st.parts); m(); opened = o; }
  m();
  BOX.forEach((id, i) => { $(id).style.minHeight = hi[i] + 'px'; });
}
// Was trotzdem größer wird, behält seinen Platz bis zur nächsten Folie.
const grow = () => BOX.forEach(id => { const e = $(id), h = e.offsetHeight; if (h > parseFloat(e.style.minHeight || 0)) e.style.minHeight = h + 'px'; });
let FX = {};
function render() {
  const st = STEPS[step];
  $('title').style.display = st.noT ? 'none' : '';
  if (shownStep !== step) reserve(st);
  // Erst Text und Rechnung setzen, damit die Größe des Bildes feststeht, bevor es gezeichnet wird.
  put(st); grow();
  // Das Bild wird jedes Mal als neues Element eingesetzt. So bleiben auf dem iPad keine Reste des alten Stands stehen.
  // vb: [Breite, Höhe, links, oben]. Links und oben schneiden leeren Rand weg, damit das Bild die Fläche besser nutzt.
  const [vw, vh, vx = 0, vy = 0] = st.vb || [800, 520], alt = $('fig'), neu = alt.cloneNode(false);
  neu.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  neu.innerHTML = st.fig();
  alt.replaceWith(neu);
  // Gruppen mit data-cx werden nach ihrer tatsächlichen Breite mittig auf diese Stelle gesetzt.
  neu.querySelectorAll('[data-cx]').forEach(g => { const b = g.getBBox(); g.setAttribute('transform', `translate(${+g.dataset.cx - (b.x + b.width / 2)},0)`); });
  // Gruppen mit data-fx: Mitte auf diesen Anteil der tatsächlich sichtbaren Breite (0.25 = Mitte der linken Bildhälfte).
  // data-m gibt die Mitte fest vor, damit nichts verrutscht, wenn Teile erst später erscheinen.
  FX = {};
  const r = neu.getBoundingClientRect(), sc = Math.min(r.width / vw, r.height / vh), sw = r.width / sc;
  neu.querySelectorAll('[data-fx]').forEach(g => {
    const m = g.dataset.m ? +g.dataset.m : (b => b.x + b.width / 2)(g.getBBox());
    const d = vx + (vw - sw) / 2 + +g.dataset.fx * sw - m;
    FX[g.dataset.k || ''] = d; g.setAttribute('transform', `translate(${d},0)`);
  });
  if (shownStep !== step) {
    shownStep = step;
    $('extras').innerHTML = (st.btns || []).map((b, i) => `<button data-b="${i}">${b.l}</button>`).join('');
    $('cnt').textContent = `${step + 1} / ${STEPS.length}`;
  }
  $('prev').disabled = step === 0 && !(shown && sub > 0) && !(st.seq && opened.size);
  $('next').disabled = step === STEPS.length - 1 && !((st.rv || st.seq) && !done(st));
}
// end: beim Zurückgehen auf der vorigen Folie mit allen Schritten aufgedeckt landen.
function go(d, end) {
  const n = step + d; if (n < 0 || n >= STEPS.length) return;
  step = n; shown = false; sub = 0; opened = new Set();
  if (STEPS[step].enter) STEPS[step].enter();
  if (end && STEPS[step].rv) { shown = true; sub = STEPS[step].rv; }
  if (end && STEPS[step].seq) opened = new Set(STEPS[step].parts);
  render();
}
// Zurück nimmt immer nur einen Schritt zurück. Erst am Anfang einer Folie geht es zur vorigen.
const back = () => {
  const st = STEPS[step];
  if (st.seq && opened.size) { const k = [...st.parts].reverse().find(x => opened.has(x)); opened.delete(k); render(); }
  else if (st.rv && shown && sub > 0) { sub--; shown = sub > 0; render(); } else go(-1, true);
};
$('prev').addEventListener('click', back);
// Weiter deckt erst auf, was noch fehlt, bei seq einen Teil nach dem anderen. Danach geht es zur nächsten Folie.
const fwd = () => {
  const st = STEPS[step];
  if (st.seq && !done(st)) { opened.add(st.parts.find(k => !opened.has(k))); render(); }
  else if (st.rv && !done(st)) { shown = true; sub = Math.min(st.rv, sub + 1); render(); } else go(1);
};
addEventListener('resize', () => { shownStep = -1; render(); });
$('next').addEventListener('click', fwd);
$('extras').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  STEPS[step].btns[+b.dataset.b].f(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); fwd(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
});
// Antippen im Bild deckt den Teil an dieser Stelle auf, nochmal Antippen verdeckt ihn wieder.
function svgPt(e) {
  const [vw, vh, vx = 0, vy = 0] = STEPS[step].vb || [800, 520];
  const r = $('fig').getBoundingClientRect(), sc = Math.min(r.width / vw, r.height / vh);
  return { x: vx + (e.clientX - r.left - (r.width - vw * sc) / 2) / sc, y: vy + (e.clientY - r.top - (r.height - vh * sc) / 2) / sc };
}
// Das Bild wird bei jedem Zeichnen ersetzt, deshalb hört die Seite selbst auf Tipps ins Bild.
document.addEventListener('pointerdown', e => {
  if (!e.target.closest || !e.target.closest('#fig')) return;
  const st = STEPS[step], k = st.hit && st.hit(svgPt(e));
  if (k) { flip(k); render(); }
});
// Manche Antworten stehen unten in der Rechnungszeile, dort tippt man direkt auf die Frage.
$('eq').addEventListener('pointerdown', e => {
  const st = STEPS[step];
  if (st.eqHit && e.target.closest('.tap')) { flip(st.eqHit); render(); }
});
if (STEPS[0].enter) STEPS[0].enter();
render();
// Vollbild: Knopf oder Taste F. Nach einem Seitenwechsel holt der erste Tipp das Vollbild zurück.
(() => {
  const d = document, el = d.documentElement, b = d.getElementById('fs');
  if (!b) return;
  // Als App vom Home-Bildschirm gibt es keine Browserleisten. Vollbild brächte dort nur das X oben links.
  const app = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (app || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) { b.hidden = true; return; }
  const on = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  const want = v => { try { if (v === undefined) return sessionStorage.getItem('fs') === '1'; sessionStorage.setItem('fs', v ? '1' : '0'); } catch (e) { return false; } };
  const call = (o, f) => { if (!f) return; try { const p = f.call(o); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
  const enter = () => call(el, el.requestFullscreen || el.webkitRequestFullscreen);
  const exit = () => call(d, d.exitFullscreen || d.webkitExitFullscreen);
  const toggle = () => { if (on()) { want(false); exit(); } else { want(true); enter(); } };
  let leaving = false;
  const sync = () => {
    const f = on(); el.classList.toggle('fs', f); if (!f) el.classList.remove('wide');
    b.setAttribute('aria-pressed', f); b.title = f ? 'Vollbild beenden (F)' : 'Vollbild (F)';
  };
  const change = () => { sync(); if (!on() && !leaving) want(false); };   // mit X oder Esc beendet
  b.addEventListener('click', toggle);
  d.addEventListener('fullscreenchange', change);
  d.addEventListener('webkitfullscreenchange', change);
  d.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (a) { if (!a.hasAttribute('download')) leaving = true; return; }
    if (!b.contains(e.target) && !on() && want()) enter();
  }, true);
  d.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggle(); }
    else if (e.key !== 'Escape' && !on() && want()) enter();
  });
  addEventListener('pagehide', () => { leaving = true; });
  addEventListener('pageshow', () => { leaving = false; sync(); });
  sync();
})();
// App vom Home-Bildschirm: Sie hat keine Zurück-Taste. Links führen deshalb nur zu eigenen Seiten, und die haben alle einen Weg zum Menü.
if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) document.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const u = new URL(a.href);
  if (a.hasAttribute('download') || u.origin !== location.origin || !/(\/|\.html)$/.test(u.pathname)) e.preventDefault();
}, true);
// Offline: Nach dem ersten Aufruf liegen alle Stunden im Speicher.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
